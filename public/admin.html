<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель завантаження матеріалів</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 2rem;
            min-height: 100vh;
        }

        .admin-card {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid #2d2d2d;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* Dropzone */
        .dropzone {
            border: 2px dashed #0066cc;
            border-radius: 8px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            background: rgba(0, 102, 204, 0.05);
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
        }

        .dropzone:hover, .dropzone.drag-over {
            background: rgba(0, 102, 204, 0.12);
            border-color: #3388ff;
        }

        .dropzone p {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .dropzone span {
            font-size: 0.85rem;
            color: #888888;
        }

        .dropzone input[type="file"] {
            display: none;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn-primary, .btn-secondary, .btn-danger {
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: #0066cc;
            color: #ffffff;
            flex: 2;
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #cccccc;
            border: 1px solid #3d3d3d;
            flex: 1;
        }

        .btn-danger {
            background: #d32f2f;
            color: #ffffff;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .btn-primary:disabled, .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary:hover:not(:disabled), .btn-secondary:hover:not(:disabled) {
            opacity: 0.9;
        }

        /* Queue List Container */
        .queue-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .empty-queue {
            text-align: center;
            padding: 2rem;
            color: #666666;
            background: #181818;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px dashed #2a2a2a;
        }

        /* Queue Item Card */
        .batch-item-card {
            background: #252525;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .item-title strong {
            color: #ffffff;
            font-size: 1rem;
        }

        .item-title .filename {
            font-size: 0.8rem;
            color: #888888;
        }

        /* Status Badges */
        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .status-processing { background: rgba(33, 150, 243, 0.15); color: #2196f3; }
        .status-completed { background: rgba(76, 175, 80, 0.15); color: #4caf50; }
        .status-error { background: rgba(244, 67, 54, 0.15); color: #f44336; }

        /* Single Photo Preview & Badge */
        .no-photo-badge {
            font-size: 0.85rem;
            color: #777777;
            font-style: italic;
        }

        .single-photo-preview {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem;
            border-radius: 6px;
            width: fit-content;
        }

        .single-photo-preview img {
            width: 50px;
            height: 65px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Multi-Photo Selector Grid */
        .multi-photo-picker {
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid #333;
        }

        .picker-label {
            font-size: 0.85rem;
            color: #bbbbbb;
            margin-bottom: 0.5rem;
        }

        .thumbnails-grid {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
        }

        .thumb-wrapper {
            position: relative;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            padding: 2px;
            transition: border-color 0.2s ease;
            background: rgba(0, 0, 0, 0.3);
        }

        .thumb-wrapper img {
            width: 65px;
            height: 85px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .thumb-wrapper.active {
            border-color: #4caf50;
        }

        .file-size {
            display: block;
            font-size: 0.7rem;
            text-align: center;
            color: #888888;
            margin-top: 3px;
        }

        .error-text {
            font-size: 0.85rem;
            color: #f44336;
            background: rgba(244, 67, 54, 0.1);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.25rem;
        }

        .editor-section {
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #333;
        }

        .editor-toolbar, .editor-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .editor-toolbar {
            grid-template-columns: 1fr auto;
        }

        .editor-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .editor-field.full-width {
            grid-column: 1 / -1;
        }

        .editor-field input, .editor-field textarea, .editor-field select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #444;
            border-radius: 6px;
            background: #181818;
            color: #eee;
            font: inherit;
        }

        .editor-field input[type="checkbox"] {
            width: auto;
        }

        .editor-field textarea {
            min-height: 10rem;
            resize: vertical;
        }

        .editor-status {
            min-height: 1.5rem;
            margin-top: 0.75rem;
        }

        .editor-status.error {
            color: #f44336;
        }

        @media (max-width: 600px) {
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>

    <div class="admin-card">
        <div id="record-editor-root"></div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"
        integrity="sha384-DdGlNq+wVXAn83gXqwyeFHB7iyXy6L0rLrNzgDmhKWPjiJLg9vj6qosYmZmkMfQ+"
        crossorigin="anonymous"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js"
        integrity="sha384-8NWE3bZDrmRI4IePMoQaEoLhAQ1MmRMJkdNgnGiHRFanTqsFKr0TmK6aSZvFJ/PO"
        crossorigin="anonymous"></script>
    <script src="admin.js" defer></script>
</body>
</html>
