<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга Пам'яті Захисників</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #c9a227;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --muted: #6c757d;
            --border: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .search-box {
            margin-bottom: 2rem;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .results-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }

        .card-photo {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #e0e0e0;
        }

        .card-body {
            padding: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 0.25rem 0;
        }

        .card-rank {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 0.5rem;
            text-transform: capitalize;
        }

        /* Modal View */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 1rem;
            box-sizing: border-box;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--muted);
        }

        .memorial-profile {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 2rem;
        }

        @media (max-width: 650px) {
            .memorial-profile {
                grid-template-columns: 1fr;
            }
        }

        .profile-photo {
            width: 100%;
            border-radius: 6px;
            object-fit: cover;
        }

        .profile-dates {
            font-weight: 600;
            color: var(--accent);
            margin-top: 0.5rem;
        }

        .profile-history {
            margin-top: 1.5rem;
            line-height: 1.7;
            white-space: pre-line;
            color: #333;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Пам’яті Героїв</h1>
            <p style="color: var(--muted)">Шукайте колег за прізвищем або ім'ям</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Введіть прізвище або ім'я..." autocomplete="off">
        </div>

        <div id="resultsList" class="results-list"></div>
        <div id="emptyMessage" class="hidden" style="text-align: center; color: var(--muted); margin-top: 2rem;">
            За вашим запитом нікого не знайдено.
        </div>
    </div>

    <!-- Memorial Modal -->
    <div id="memorialModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="search.js" defer></script>
</body>
</html>
